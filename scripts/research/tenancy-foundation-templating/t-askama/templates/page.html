{% extends "layout.html" %}{% block content %}<form method="post"><label for="n">Name</label><input id="n" name="n" value="{{ form_name }}" aria-describedby="n-h"><p id="n-h">Example: helsinki-bikes</p>{% if let Some(e) = error %}<p role="alert">{{ e }}</p>{% endif %}</form><table><tr><th>Id</th><th>Name</th><th>Status</th></tr>{% for r in rows %}<tr><td>{{ r.id }}</td><td>{{ r.name }}</td><td>{{ r.status }}</td></tr>{% endfor %}</table>{% endblock %}
